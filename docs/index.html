<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葱痛研车友名录</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="logo.jpg" alt="Logo" id="logo">
        <img src="teaser.png" alt="Teaser" id="teaser">
    </header>
    <div class="filters">
        <!-- 筛选控件 -->
    </div>
    <div id="image-list">   
        <div class="image-item">
            <img src="images/星空_本田_飞度_喵斯快跑_2023_1.jpg" alt="星空">
            <div class="image-details">星空 本田 <class 'type'> 喵斯快跑 2023 1 </div>
        </div>
    </div>
    <div class="pagination">
        <button id="prev-btn" onclick="prevPage()">上一页</button>
        <span id="page-info"></span>
        <input type="number" id="page-input" min="1" max="totalPages" placeholder="页码">
        <button onclick="goToPage()">跳转</button>
        <button id="next-btn" onclick="nextPage()">下一页</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
